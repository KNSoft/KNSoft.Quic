name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, windows-11-vs2026-arm]
        platform: [x64, x86, ARM64, ARM64EC]
        config: [Debug, DebugMD, Release, ReleaseMD]
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Prepare MSBuild
      uses: microsoft/setup-msbuild@main
    - name: Build
      run: msbuild .\KNSoft.Quic.slnx /restore /m /p:Configuration=${{matrix.config}} /p:Platform=${{matrix.platform}} /p:RestorePackagesConfig=true
  Publish:
    if: ${{github.base_ref == '' && startsWith(github.event.head_commit.message, '[VERSION] ')}}
    needs: Build
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest
    steps:
    - name: Set release version
      id: relver
      shell: pwsh
      run: |
        $relver="${{github.event.head_commit.message}}".Substring(10)
        Write-Output "relver=$relver">>$env:GITHUB_OUTPUT
    - name: Source checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Prepare MSBuild
      uses: microsoft/setup-msbuild@main
    - name: Clean output
      shell: pwsh
      run: |
        $OutDir = Join-Path $PWD 'OutDir'
        if (Test-Path -LiteralPath $OutDir) {
          Remove-Item -LiteralPath $OutDir -Recurse -Force
        }
    - name: Build
      shell: pwsh
      run: |
        foreach ($Configuration in @('Debug', 'DebugMD', 'Release', 'ReleaseMD')) {
          foreach ($Platform in @('x64', 'x86', 'ARM64', 'ARM64EC')) {
            & msbuild .\KNSoft.Quic.slnx /restore /m "/p:Configuration=$Configuration" "/p:Platform=$Platform" /p:RestorePackagesConfig=true
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
        }
    - name: Create NuGet package
      run: nuget pack
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: Ratin
    - name: Publish NuGet package
      run: dotnet nuget push .\KNSoft.Quic.${{steps.relver.outputs.relver}}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        name: v${{steps.relver.outputs.relver}}
        tag_name: v${{steps.relver.outputs.relver}}
        body: "(TO BE FILLED BY MAINTAINER)\n**NuGet Package**: https://www.nuget.org/packages/KNSoft.Quic/${{steps.relver.outputs.relver}}"
        prerelease: true
        preserve_order: true
        fail_on_unmatched_files: true
        generate_release_notes: true
        files: ./KNSoft.Quic.${{steps.relver.outputs.relver}}.nupkg
